[package]
name = "uwulock-bitwarden"
description = "Talks to Bitwarden and Vaultwarden: login, sync, saving; the crypto to open what comes back is uwulock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No doc tests: the examples in the docs are prose, and each would be a binary to link.
[lib]
doctest = false

[dependencies]
uwulock-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = "2"
# rustls with both the bundled roots and the system's own store: a homelab
# Vaultwarden behind a private CA works once that CA is trusted by the system.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "rustls-tls-native-roots",
] }

[dev-dependencies]
tokio = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
url = "2"
zeroize = { workspace = true }
