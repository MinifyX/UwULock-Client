[package]
name = "uwulock-wasm"
description = "uwulock-core as WebAssembly, for the browser extension's background worker: the vault, autofill and passkeys behind the calls the extension makes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
uwulock-core.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "2"
# The CLI that makes the JavaScript glue has to be this exact version
# (apps/extension/scripts/build-wasm.mjs checks).
wasm-bindgen = "=0.2.129"
zeroize.workspace = true

[dev-dependencies]
p256.workspace = true

# Randomness in the browser: the getrandom uwulock-core takes it from, with
# crypto.getRandomValues.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
