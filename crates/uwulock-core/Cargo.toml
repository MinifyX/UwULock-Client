[package]
name = "uwulock-core"
description = "Bitwarden's crypto and data formats, without a network: master key, encrypted values, the sync format, the decrypted vault, TOTP, passkeys, the password generator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Nothing networked in here: this crate is also built for
# wasm32-unknown-unknown, for the web vault of UwULock-Server.
# No doc tests: the examples in the docs are prose, and each would be a binary to link.
[lib]
doctest = false

[dependencies]
aes.workspace = true
argon2.workspace = true
base64.workspace = true
cbc.workspace = true
hkdf.workspace = true
hmac.workspace = true
p256.workspace = true
pbkdf2.workspace = true
rand.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
sha3.workspace = true
subtle.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize = { workspace = true, features = ["serde"] }
url = "2"
# The suite vault (UwUSSH's and UwURDP's records): XChaCha20-Poly1305, record
# ids, and new Ed25519 keys as OpenSSH text. No uuid `v4` (its getrandom would
# need its own wasm setup); ids come from rand.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
ssh-key = { version = "0.6", default-features = false, features = [
  "alloc",
  "std",
  "ecdsa",
  "ed25519",
  "encryption",
] }

# In a browser, randomness comes from crypto.getRandomValues (rand 0.8 reaches
# it through getrandom 0.2).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
