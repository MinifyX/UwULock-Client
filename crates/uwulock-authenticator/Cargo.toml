[package]
name = "uwulock-authenticator"
description = "UwULock as a passkey provider for the systems: CTAP2 and its CBOR, CTAPHID over a virtual HID device (Linux /dev/uhid), WebAuthn's JSON (Android's Credential Manager) and the sealed passkey list the Apple extension reads. Protocol only: the app holds the vault and asks the person."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[dependencies]
uwulock-core.workspace = true
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64.workspace = true
p256.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
p256.workspace = true
