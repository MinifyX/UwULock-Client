name: Installers

# macOS and Linux: the checks Windows gets on Lorin's machine. Then every file
# `pnpm release` publishes: the Windows setups for x64 and ARM, the universal
# macOS disk image, .deb, .rpm and portable folder for Linux x64 and arm64, and
# the browser extension for Chromium and Firefox (extension.yml, called below).
# Nothing here holds the update signing key: the files the updater runs are
# signed by `pnpm release`, next to the key, after it downloads them from here.
#
# The Mac disk image is signed with the Developer ID and notarized by Apple
# when the secrets APPLE_DEVELOPER_ID_KEY and APPLE_DEVELOPER_ID_CERT are set
# (docs/install.md), on machines that build nothing — the certificate never
# shares a machine with a few hundred build scripts, as in mas.yml:
#
#   macos-app (builds) → macos-sign-app (signs, notarizes)
#     → macos-setup (builds the setup around it) → macos-sign-setup (signs, notarizes)
#
# Without the secrets the same jobs hand everything on ad-hoc signed, as
# before. The app carries the Safari extension (docs/extension.md), which the
# extension job builds beside it (scripts/wait-artifact.sh).

on:
  push:
    tags: ['v*']
    # A branch to try the builds on before a release is tagged.
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read
  # scripts/wait-artifact.sh looks for the Safari extension of this run.
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  CARGO_TERM_COLOR: always
  # Tauri runs linuxdeploy, itself an AppImage; runners have no FUSE for it.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  # The browser extension's packages, as artifact `extension`, in this run: `pnpm release`
  # downloads everything from one run of this workflow.
  extension:
    uses: ./.github/workflows/extension.yml

  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Every `uses:` is pinned to a commit, with the version in the comment: a
      # tag can be moved, and `@stable` is a branch.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev pkg-config patchelf file libfuse2

      # tauri-build wants every app's frontendDist to exist; checking needs no real build,
      # and no Node (ci.yml typechecks the pages).
      - run: mkdir -p apps/desktop/dist apps/setup/dist

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Linux shares ci.yml's cache from main: a tag starts warm.
          shared-key: ${{ runner.os == 'Linux' && 'linux' || 'macos' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --all --check
      - name: Everything, on Linux
        if: runner.os == 'Linux'
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --no-fail-fast
      # On macOS only what is different there: the two apps. The crates' tests don't depend
      # on the system and ran on Linux.
      - name: The apps, on macOS
        if: runner.os == 'macOS'
        run: cargo clippy -p uwulock-desktop -p uwulock-setup --all-targets -- -D warnings

  # In parallel with the checks: `pnpm release` only takes a run where everything passed.
  installers:
    name: Setup (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # (macOS: the macos-* jobs below.)
          # The oldest supported Ubuntu, so the packages and the portable
          # folder run on anything as new or newer. Two machines at once: the
          # .deb and .rpm need the app built once more (as package `uwulock`),
          # the setup needs the AppImage first; `merge-linux-x64` below joins
          # what both left into the artifact installers-linux-x64.
          - name: linux-x64
            os: ubuntu-22.04
            target: ''
            part: setup
            artifact: part-linux-x64-setup
          - name: linux-x64-packages
            os: ubuntu-22.04
            target: ''
            part: packages
            artifact: part-linux-x64-packages
            cache-key: linux-x64
          # Natively on ARM, same Ubuntu: nothing has to be cross-linked.
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: ''
          # The setup most people run. `pnpm release --build-windows` can still
          # build it on Lorin's machine instead.
          - name: windows-x64
            os: windows-latest
            target: ''
          # Natively on ARM: ring's assembly wants clang for this target, which
          # the ARM runner brings, and nothing has to be cross-linked.
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev pkg-config patchelf file libfuse2 xdg-utils

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      # Saved only by a run on main (started by hand before a release): a cache a tag saves is
      # only ever seen by that tag, and the space for caches is shared with every workflow.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.cache-key || matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the setup
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PART: ${{ matrix.part }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          if [ -n "$PART" ]; then args+=(--part "$PART"); fi
          node scripts/build-setup.mjs "${args[@]}"
          ls -la target/installers

      # The setup unpacks what it carries into a scratch folder and checks the
      # app arrived startable — the part of an install no window is needed
      # for. (macOS: in macos-sign-setup.) The Windows setup has no such mode
      # and is checked by what it was built from.
      - name: Check what the setup carries
        if: matrix.name == 'linux-x64'
        shell: bash
        run: |
          set -e
          check="$RUNNER_TEMP/payload-check"
          setup=target/installers/UwULock-update-linux-x64.AppImage
          "$setup" --check-payload "$check"
          ldd "$check/UwULock/usr/bin/"* | grep "not found" && exit 1 || echo "every library found"

      # The .deb installs through dpkg as package `uwulock` (what the app checks
      # before it updates itself), the .rpm is named the same, and the portable
      # folder has everything it needs next to it. No display here, so no start.
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.name == 'linux-arm64' && 'arm64' || 'x64' }}
          PART: ${{ matrix.part }}
        run: |
          set -e
          arch="$ARCH"
          # Each half checks what it built (--part in build-setup.mjs); left unindented below,
          # as the Python in between must start at the line's beginning.
          if [ "$PART" != setup ]; then
          sudo apt-get install -y ./target/installers/UwULock-linux-$arch.deb
          test -f /var/lib/dpkg/info/uwulock.list
          grep -qx /usr/bin/uwulock-desktop /var/lib/dpkg/info/uwulock.list
          grep -q '^Name=UwULock$' /usr/share/applications/uwulock.desktop
          # The virtual security key (passkeys): the hidraw rule, the root helper and its
          # systemd units — and no more uaccess on /dev/uhid (docs/passkeys.md).
          grep -qx /usr/lib/udev/rules.d/60-uwulock-passkeys.rules /var/lib/dpkg/info/uwulock.list
          if grep -q 'KERNEL=="uhid"' /usr/lib/udev/rules.d/60-uwulock-passkeys.rules; then exit 1; fi
          grep -qx /usr/lib/uwulock/uwulock-uhid-broker /var/lib/dpkg/info/uwulock.list
          test -x /usr/lib/uwulock/uwulock-uhid-broker
          grep -qx /usr/lib/systemd/system/uwulock-uhid-broker.socket /var/lib/dpkg/info/uwulock.list
          grep -qx /usr/lib/systemd/system/uwulock-uhid-broker@.service /var/lib/dpkg/info/uwulock.list
          systemd-analyze verify /usr/lib/systemd/system/uwulock-uhid-broker.socket
          systemctl is-enabled uwulock-uhid-broker.socket
          test -S /run/uwulock/uhid-broker.sock
          # The helper starts in its sandbox and turns away whoever isn't the person at
          # the seat — on a runner, everybody.
          python3 -c '
          import socket
          s = socket.socket(socket.AF_UNIX); s.settimeout(10)
          s.connect("/run/uwulock/uhid-broker.sock")
          data = b""
          while len(data) < 3 or len(data) < 3 + int.from_bytes(data[1:3], "big"):
              chunk = s.recv(512)
              assert chunk, data
              data += chunk
          print(data)
          assert data[0] == 0x7f and b"seat" in data, data
          '
          ldd /usr/bin/uwulock-desktop | grep "not found" && exit 1 || echo "every library found"
          sudo apt-get remove -y uwulock
          test ! -e /usr/bin/uwulock-desktop
          if systemctl is-active --quiet uwulock-uhid-broker.socket; then exit 1; fi

          sudo apt-get install -y rpm
          test "$(rpm -qp --queryformat '%{NAME}' target/installers/UwULock-linux-$arch.rpm)" = uwulock
          rpm -qpl target/installers/UwULock-linux-$arch.rpm | grep -qx /usr/bin/uwulock-desktop
          rpm -qpl target/installers/UwULock-linux-$arch.rpm | grep -qx /usr/lib/udev/rules.d/60-uwulock-passkeys.rules
          rpm -qpl target/installers/UwULock-linux-$arch.rpm | grep -qx /usr/lib/uwulock/uwulock-uhid-broker
          # systemd runs it: it has to be executable in the .rpm too.
          rpm -qplv target/installers/UwULock-linux-$arch.rpm | grep -qE '^-rwxr-xr-x .* /usr/lib/uwulock/uwulock-uhid-broker$'
          fi

          if [ "$PART" != packages ]; then
          portable="$RUNNER_TEMP/portable"
          mkdir -p "$portable"
          tar -xzf target/installers/UwULock-linux-$arch-portable.tar.gz -C "$portable"
          test "$(ls "$portable")" = UwULock
          test -x "$portable/UwULock/uwulock" && test -x "$portable/UwULock/AppRun"
          test -f "$portable/UwULock/README.txt"
          LD_LIBRARY_PATH="$portable/UwULock/usr/lib" ldd "$portable/UwULock/usr/bin/uwulock-desktop" \
            | grep "not found" && exit 1 || echo "every library found"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact || format('installers-{0}', matrix.name) }}
          path: target/installers/*
          if-no-files-found: error
          retention-days: 14

  # ── macOS: one disk image for Intel and Apple silicon ─────────────────────
  # Both halves built on Apple silicon (the runner images for Intel Macs come
  # and go) and joined (scripts/build-setup.mjs).
  macos-app:
    name: macOS app (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # Its own cache since the Intel half builds in target/x86_64-build; shared by name with
      # macos-setup and mas.yml, which only read it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-universal-split
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The Safari extension (job `extension`)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-artifact.sh extension-safari 'Build, test and package'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-safari
          path: target/extension
      - run: |
          mkdir -p apps/extension/dist/safari
          unzip -q target/extension/UwULock-extension-safari.zip -d apps/extension/dist/safari

      - name: Build UwULock.app
        run: node scripts/build-setup.mjs --target universal-apple-darwin --part app
      # `ditto` keeps what an app bundle is made of — links, modes, extended attributes.
      - run: ditto -c -k --keepParent target/installers/macos/UwULock.app UwULock-app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app-unsigned
          path: UwULock-app.zip
          if-no-files-found: error
          retention-days: 3

  macos-sign-app:
    name: macOS app, signed
    needs: macos-app
    runs-on: macos-latest
    env:
      DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_KEY != '' && secrets.APPLE_DEVELOPER_ID_CERT != '' }}
    steps:
      # Only the scripts, not the workspace: nothing here installs or builds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/apple-ci.sh
            scripts/macos-sign.mjs
            apps/desktop/src-tauri/apple/SafariExtension
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-app-unsigned
      - run: ditto -x -k UwULock-app.zip app
      - name: The Developer ID and the App Store Connect key
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_DEVELOPER_ID_KEY: ${{ secrets.APPLE_DEVELOPER_ID_KEY }}
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          bash scripts/apple-ci.sh developer-id
          bash scripts/apple-ci.sh api-key
      - name: Sign and notarize
        if: env.DEVELOPER_ID == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: node scripts/macos-sign.mjs app app/UwULock.app
      - name: Without a Developer ID
        if: env.DEVELOPER_ID != 'true'
        run: echo "::warning::No Developer ID (APPLE_DEVELOPER_ID_KEY, APPLE_DEVELOPER_ID_CERT) — the disk image stays ad-hoc signed, and Safari won't load its extension."
      - run: ditto -c -k --keepParent app/UwULock.app UwULock-app.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          path: UwULock-app.zip
          if-no-files-found: error
          retention-days: 3
      - name: Remove the keychain and the key
        if: always()
        run: bash scripts/apple-ci.sh cleanup

  macos-setup:
    name: macOS setup (universal)
    needs: macos-sign-app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      # The app's cache (macos-app): the setup is built on the same dependencies.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-universal-split
          save-if: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-app
      - run: ditto -x -k UwULock-app.zip "$RUNNER_TEMP/payload"
      - name: Build the setup
        run: |
          node scripts/build-setup.mjs --target universal-apple-darwin --part setup --payload "$RUNNER_TEMP/payload"
          cp target/installers/UwULock-update-macos-universal target/installers/macos/
          cp target/installers/UwULock-macos-universal.dmg target/installers/macos/UwULock-macos-universal-adhoc.dmg
          ditto -c -k --keepParent target/installers/macos setup.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-setup-unsigned
          path: setup.zip
          if-no-files-found: error
          retention-days: 3

  macos-sign-setup:
    name: Setup (macos-universal)
    needs: macos-setup
    runs-on: macos-latest
    env:
      DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID_KEY != '' && secrets.APPLE_DEVELOPER_ID_CERT != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/apple-ci.sh
            scripts/macos-sign.mjs
            apps/desktop/src-tauri/apple/SafariExtension
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-setup-unsigned
      - run: ditto -x -k setup.zip work
      - name: The Developer ID and the App Store Connect key
        if: env.DEVELOPER_ID == 'true'
        env:
          APPLE_DEVELOPER_ID_KEY: ${{ secrets.APPLE_DEVELOPER_ID_KEY }}
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          bash scripts/apple-ci.sh developer-id
          bash scripts/apple-ci.sh api-key
      - name: Sign, the disk image anew, notarize
        if: env.DEVELOPER_ID == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: node scripts/macos-sign.mjs setup work/macos
      - name: The files `pnpm release` takes
        run: |
          mkdir -p out
          if [ "$DEVELOPER_ID" = true ]; then
            cp work/macos/UwULock-macos-universal.dmg out/
            echo developer-id > out/UwULock-macos-signing.txt
          else
            cp work/macos/UwULock-macos-universal-adhoc.dmg out/UwULock-macos-universal.dmg
            echo ad-hoc > out/UwULock-macos-signing.txt
          fi
          cp work/macos/UwULock-update-macos-universal out/
          chmod +x out/UwULock-update-macos-universal
          # Unsigned from the build (lipo keeps no signature); ad-hoc like the rest, so Apple
          # silicon runs it. The Developer ID path signed it in macos-sign.mjs.
          if [ "$DEVELOPER_ID" != true ]; then
            codesign --force --sign - --identifier app.uwulock.setup out/UwULock-update-macos-universal
          fi
          ls -la out
      # The setup unpacks what it carries into a scratch folder and checks the app arrived
      # startable. The universal one runs as arm64 here, its Intel half is checked for being
      # there; a notarized app has its ticket with it.
      - name: Check what the setup carries
        run: |
          set -e
          check="$RUNNER_TEMP/payload-check"
          setup=out/UwULock-update-macos-universal
          lipo "$setup" -verify_arch arm64 x86_64
          codesign --verify --strict "$setup"
          "$setup" --check-payload "$check"
          for app in "$check"/*.app; do
            codesign --verify --deep --strict "$app"
            lipo "$app"/Contents/MacOS/* -verify_arch arm64 x86_64
            test -f "$app/Contents/PlugIns/UwULockSafari.appex/Contents/Resources/manifest.json"
            if [ "$DEVELOPER_ID" = true ]; then
              xcrun stapler validate "$app"
              spctl --assess --type execute --verbose=2 "$app"
            fi
            echo "signed, universal, with the Safari extension: $app"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-macos-universal
          path: out/*
          if-no-files-found: error
          retention-days: 14
      - name: Remove the keychain and the key
        if: always()
        run: bash scripts/apple-ci.sh cleanup

  # The two halves of Linux x64 as one artifact, installers-linux-x64, as `pnpm release` takes it.
  merge-linux-x64:
    name: Setup (linux-x64, joined)
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-linux-x64
          pattern: part-linux-x64-*
          delete-merged: true
          retention-days: 14
