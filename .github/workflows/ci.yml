name: CI

# Every pull request and every push to main: formatting, the i18n check, the typecheck of
# every page and the desktop app's page tests, then clippy and every Rust test on Linux, and
# uwulock-core for WebAssembly — three jobs side by side. The browser extension has its own
# workflow (extension.yml); the setups are built for tags (installers.yml), which start from
# this workflow's cache of main.

on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'release-notes/**', 'brand/**', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'release-notes/**', 'brand/**', 'LICENSE']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pages:
    name: Formatting, i18n, types
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` is pinned to a commit, with the version in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # The extension's types need its WebAssembly (extension.yml); the apps' don't.
      - run: pnpm --filter @uwulock/desktop --filter @uwulock/setup typecheck
      # The desktop app's own logic (the review's cards), straight in Node: no framework.
      - run: pnpm --filter @uwulock/desktop test

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev pkg-config
      # tauri-build wants every app's frontendDist to exist; checking needs no real build.
      - run: mkdir -p apps/desktop/dist apps/setup/dist
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # installers.yml's Linux check takes the same cache for a tag.
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The App Store builds' app: no updater (docs/app-store.md). Only UwULock itself builds again.
      - run: cargo clippy -p uwulock-desktop --no-default-features --features store -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  wasm:
    name: uwulock-core for WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # uwulock-core also runs in UwULock-Server's web vault and in the browser extension
      # (uwulock-wasm): nothing networked or browser-unsafe may creep in.
      - run: cargo clippy -p uwulock-core -p uwulock-wasm --target wasm32-unknown-unknown -- -D warnings
