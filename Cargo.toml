[workspace]
resolver = "2"
members = [
  "crates/uwulock-bitwarden",
  "apps/desktop/src-tauri",
  "apps/setup/src-tauri",
]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwULock-Client"
rust-version = "1.89"

[workspace.dependencies]
uwulock-bitwarden = { path = "crates/uwulock-bitwarden" }

anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Bitwarden's crypto, all RustCrypto: PBKDF2 or Argon2id for the master key,
# HKDF to stretch it, AES-256-CBC with HMAC-SHA256 for every field, RSA-OAEP
# for organisation keys.
aes = "0.8"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
windows-sys = "0.61"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
