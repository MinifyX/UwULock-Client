[workspace]
resolver = "2"
members = [
  "crates/uwulock-core",
  "crates/uwulock-bitwarden",
  "crates/uwulock-wasm",
  "crates/uwulock-authenticator",
  "crates/uwulock-uhid-broker",
  "crates/tauri-plugin-uwulock-mobile",
  "apps/desktop/src-tauri",
  "apps/setup/src-tauri",
]

[workspace.package]
version = "0.6.0-beta.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/MinifyX/UwULock-Client"
rust-version = "1.89"

[workspace.dependencies]
uwulock-core = { path = "crates/uwulock-core" }
uwulock-bitwarden = { path = "crates/uwulock-bitwarden" }
uwulock-authenticator = { path = "crates/uwulock-authenticator" }

parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Bitwarden's crypto, all RustCrypto: PBKDF2 or Argon2id for the master key,
# HKDF to stretch it, AES-256-CBC with HMAC-SHA256 for every field, RSA-OAEP
# for organisation keys.
aes = "0.8"
argon2 = { version = "0.5", features = ["zeroize"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
# Passkeys that sign in: ECDSA on P-256, keys as PKCS#8.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
# XposedOrNot's password prefix: the original Keccak-512.
sha3 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
windows-sys = "0.61"

# Debug builds for tests: line numbers for backtraces, no debug info for dependencies — a
# smaller target/ and faster linking. Optimised are only the crates that do the heavy maths,
# so a test that derives a master key or makes an RSA key doesn't take seconds.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.uwulock-core]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

# A passphrase on a new SSH key: bcrypt-pbkdf's 16 rounds.
[profile.dev.package.bcrypt-pbkdf]
opt-level = 3

[profile.dev.package.blowfish]
opt-level = 3

# The setup's build script packs the app with zstd at level 19 (apps/setup/src-tauri/build.rs).
# Build scripts and what they use are built without optimisation, which made that one
# compression take minutes for a Linux AppDir. Optimised, it is the same bytes in a fraction of
# the time. Only the build changes, not the setup.
[profile.release.package.zstd-sys]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
