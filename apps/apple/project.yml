# The native Apple app (iOS 27 + macOS 27): XcodeGen spec. `scripts/apple-build.sh` generates
# UwULock.xcodeproj from it (gitignored) and builds. docs/native-apple-plan.md.
#
# Configurations
#   Debug / Release                 app.uwulock: iOS/iPadOS and the Mac App Store (sandboxed)
#   Debug-Direct / Release-Direct   app.uwulock.desktop: the Mac's disk image (not sandboxed,
#                                   Sparkle updates). On iOS they build like Debug / Release.
# Schemes: "UwULock" (Debug/Release) and "UwULock Direct" (Debug-Direct/Release-Direct).
#
# Bundle IDs, App Group and Keychain groups are the Tauri builds' (up to 0.7), so existing data
# and biometric keychain items stay reachable.
#
# The Rust core (crates/uwulock-ffi) comes in with UWULOCK_RUST_CORE=YES (rustcore.yml), which
# scripts/apple-build.sh sets when Frameworks/UwuLockFFI.xcframework exists.
name: UwULock

options:
  bundleIdPrefix: app.uwulock
  developmentLanguage: de
  deploymentTarget:
    iOS: '27.0'
    macOS: '27.0'
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: '27.2'

configs:
  Debug: debug
  Release: release
  Debug-Direct: debug
  Release-Direct: release

# Shared settings, plus Config/Local.xcconfig (gitignored: DEVELOPMENT_TEAM) when it exists.
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
  Debug-Direct: Config/Direct.xcconfig
  Release-Direct: Config/Direct.xcconfig

include:
  - path: rustcore.yml
    enable: ${UWULOCK_RUST_CORE}

packages:
  UwUDesign:
    path: Packages/UwUDesign
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 2.10.1, by commit: the signed builds take exactly this code.
    revision: ab7d71291238df6e0492143b120c9b696a35f603

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: 0.7.0
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic

targets:
  UwULock:
    type: application
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - path: UwULock
        excludes:
          - Resources/Info.plist
    dependencies:
      - package: UwUDesign
      # Only the Direct build uses it (#if DIRECT). The others drop it again: the linker
      # (-dead_strip_dylibs) and the "Remove Sparkle" phase below.
      - package: Sparkle
        destinationFilters: [macOS]
      - target: CredentialProvider
      - target: SafariExtension
    settings:
      base:
        PRODUCT_NAME: UwULock
        PRODUCT_MODULE_NAME: UwULock
        PRODUCT_BUNDLE_IDENTIFIER: $(UWULOCK_BUNDLE_ID)
        INFOPLIST_FILE: UwULock/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: UwULock
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: GPL-3.0-only
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Config/UwULock-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: $(UWULOCK_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        OTHER_LDFLAGS: $(inherited) -Wl,-dead_strip_dylibs
        # DIRECT: the disk image's build (Config/Direct.xcconfig); RUST_CORE: rustcore.yml.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(UWULOCK_DIRECT) $(UWULOCK_RUST_CORE_FLAG)
    postBuildScripts:
      # Sparkle is linked per platform, not per configuration: everything but the Direct build
      # takes it out again (no updater in the App Store's builds).
      - name: Remove Sparkle outside the Direct build
        basedOnDependencyAnalysis: false
        script: |
          case "$CONFIGURATION" in *-Direct) exit 0 ;; esac
          [ "$PLATFORM_NAME" = macosx ] || exit 0
          frameworks="${TARGET_BUILD_DIR:?}/${FRAMEWORKS_FOLDER_PATH:?}"
          rm -rf "$frameworks/Sparkle.framework"
          # The executable and, in Debug, the .debug.dylib next to it that holds the code.
          if otool -L "${TARGET_BUILD_DIR:?}/${EXECUTABLE_FOLDER_PATH:?}"/* 2>/dev/null | grep -q Sparkle.framework; then
            echo "error: $CONFIGURATION links Sparkle; only the Direct build may" >&2
            exit 1
          fi

  # AutoFill for passwords and passkeys (iOS and macOS), from
  # apps/desktop/src-tauri/apple/PasskeyProvider: same shared store (PasskeyVault.swift), sheet in
  # UwUDesign. App Store (iOS, Mac): app.uwulock.passkeys, as in the Tauri builds. Disk image:
  # app.uwulock.desktop.passkeys, because an embedded extension's ID must start with its app's
  # (the Tauri DMG put app.uwulock.passkeys into app.uwulock.desktop, which Xcode refuses; that
  # DMG was never team-signed, so no installed copy carries it). The keychain group stays
  # app.uwulock.passkeys.
  CredentialProvider:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - path: CredentialProvider
        excludes:
          - Info.plist
    dependencies:
      - package: UwUDesign
    settings:
      base:
        PRODUCT_NAME: UwULockPasskeys
        PRODUCT_MODULE_NAME: UwULockPasskeys
        PRODUCT_BUNDLE_IDENTIFIER: $(UWULOCK_BUNDLE_ID).passkeys
        INFOPLIST_FILE: CredentialProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: CredentialProvider/UwULockPasskeys-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CredentialProvider/UwULockPasskeys-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SKIP_INSTALL: YES
        # The phase below edits the processed Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Taking in Apple Passwords' data (credential exchange) is the iPhone's and iPad's: the Mac
      # doesn't offer UwULock as a target (nor did the Tauri build).
      - name: No credential exchange on the Mac
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = macosx ] || exit 0
          plist="${TARGET_BUILD_DIR:?}/${INFOPLIST_PATH:?}"
          for key in SupportsCredentialExchange SupportedCredentialExchangeVersions; do
            plutil -remove "NSExtension.NSExtensionAttributes.ASCredentialProviderExtensionCapabilities.$key" "$plist" 2>/dev/null || true
          done

  # Reads what the app and the extension share (PasskeyVault.swift: seal format, list, outbox,
  # matching, WebAuthn bytes) against a temporary folder; no host app, no Keychain. Fast.
  UwULockPasskeysTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CredentialProviderTests
      - path: CredentialProvider/PasskeyVault.swift
      - path: CredentialProvider/AutoFillLog.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.uwulock.passkeys-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: '-'

  # The Safari web extension: the handler (no native messaging) and the web extension's files
  # from apps/extension (dist/safari), copied in by the phase below.
  SafariExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    platform: auto
    sources:
      - path: SafariExtension
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: UwULockSafari
        PRODUCT_MODULE_NAME: UwULockSafari
        PRODUCT_BUNDLE_IDENTIFIER: $(UWULOCK_BUNDLE_ID).safari
        INFOPLIST_FILE: SafariExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: SafariExtension/UwULockSafari-macOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        SKIP_INSTALL: YES
        # The phase below reads apps/extension and writes into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      # Where the files come from, first that has a manifest.json:
      #   $UWULOCK_SAFARI_EXTENSION (CI's artifact), apps/extension/dist/safari;
      #   else, with pnpm and the built wasm (src/wasm/pkg), pnpm --filter @uwulock/extension build.
      # None: a warning in Debug (the extension then has no files), an error in Release unless
      # UWULOCK_SAFARI_SKIP=1. UWULOCK_SAFARI_SKIP=1 also skips it outright.
      - name: Web extension files
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          [ "${UWULOCK_SAFARI_SKIP:-}" = 1 ] && { echo "note: UWULOCK_SAFARI_SKIP=1, no web extension files"; exit 0; }
          ext="${SRCROOT:?}/../extension"
          src="${UWULOCK_SAFARI_EXTENSION:-$ext/dist/safari}"
          if [ ! -f "$src/manifest.json" ] && [ -z "${UWULOCK_SAFARI_EXTENSION:-}" ]; then
            export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/Library/pnpm:$HOME/.local/share/pnpm"
            if command -v pnpm >/dev/null && [ -d "$ext/src/wasm/pkg" ]; then
              (cd "$ext" && pnpm --filter @uwulock/extension build)
            fi
          fi
          if [ ! -f "$src/manifest.json" ]; then
            case "$CONFIGURATION" in
              Release*) echo "error: no Safari web extension in $src (pnpm --filter @uwulock/extension build:all, or UWULOCK_SAFARI_SKIP=1)" >&2; exit 1 ;;
              *) echo "warning: no Safari web extension in $src; UwULockSafari has no files (pnpm --filter @uwulock/extension build:all)"; exit 0 ;;
            esac
          fi
          out="${TARGET_BUILD_DIR:?}/${UNLOCALIZED_RESOURCES_FOLDER_PATH:?}"
          mkdir -p "$out"
          rsync -a --exclude Info.plist --exclude '*.lproj' --exclude _CodeSignature "$src/" "$out/"

schemes:
  UwULock:
    build:
      targets:
        UwULock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UwULockPasskeysTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  UwULock Direct:
    build:
      targets:
        UwULock: all
    run:
      config: Debug-Direct
    test:
      config: Debug-Direct
    profile:
      config: Release-Direct
    analyze:
      config: Debug-Direct
    archive:
      config: Release-Direct
