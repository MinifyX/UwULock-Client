<form id="signup">
  <input id="first" name="firstName" placeholder="Vorname" />
  <input id="last" name="lastName" placeholder="Nachname" />
  <input id="mail" name="email" type="email" placeholder="E-Mail" />
  <input id="pw1" name="password" type="password" placeholder="Passwort" />
  <input id="pw2" name="password_confirm" type="password" placeholder="Passwort bestätigen" />
  <button type="submit">Registrieren</button>
</form>
