[package]
name = "uwulock-desktop"
description = "UwULock desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "uwulock_desktop_lib"
# Desktop only: no mobile build wants the static or dynamic library, so only the one
# main.rs links against — one library less to link for every build and test.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uwulock-bitwarden.workspace = true

arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
base64.workspace = true
minisign-verify = "0.2"
parking_lot.workspace = true
semver = "1"
serde.workspace = true
sha2.workspace = true
url = "2"
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { workspace = true }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
] }

# Windows Hello (KeyCredentialManager): the same windows crate Tauri brings.
windows = { version = "0.61", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# A package update is handed to the package manager from a private scratch folder.
[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"
# logind and the screen saver say when the screen locks or the system sleeps.
# The same zbus (and features) tauri-plugin-opener already brings.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
