[package]
name = "uwulock-desktop"
description = "UwULock app for Windows, Linux and Android"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "uwulock_desktop_lib"
# Only the one main.rs links against — one library less to link for every desktop build
# and test. Android wants a cdylib: scripts/mobile.mjs adds it in the Android builds
# (CI and `pnpm mobile:prepare` before a local one).
crate-type = ["rlib"]

[features]
# What every download from GitHub is: a copy that looks for its own updates and installs them
# (updates.rs). Phones have no updater either way (build.rs).
default = ["self-update"]
self-update = ["dep:minisign-verify", "dep:semver", "dep:tauri-plugin-updater"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uwulock-bitwarden.workspace = true
uwulock-core.workspace = true
uwulock-authenticator.workspace = true
uwulock-app.workspace = true

base64.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
url = "2"
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { workspace = true }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The desktop's clipboard and its own updater. Phones copy through the plugin below, and
# get new versions from the release page (docs/mobile.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
minisign-verify = { version = "0.2", optional = true }
semver = { version = "1", optional = true }
tauri-plugin-updater = { version = "2", optional = true }

# Unlocking with a fingerprint or face (Android Keystore), copying secrets.
# Haptics: the page's taps and ticks (@uwusuite/design's `haptic()` calls the plugin directly).
# 2.4 wants Tauri 2.12; it moves together with Tauri and @tauri-apps/api.
# Credential Manager's provider calls into the app over JNI (passkeys/android.rs), and a
# site's Digital Asset Links are fetched for an app that asks. Both crates (and their
# features) are already in the Android build through Tauri and uwulock-bitwarden.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-uwulock-mobile = { path = "../../../crates/tauri-plugin-uwulock-mobile" }
tauri-plugin-haptics = "~2.3.3"
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
] }

# Windows Hello (KeyCredentialManager): the same windows crate Tauri brings.
windows = { version = "0.61", features = [
  "Foundation",
  "Win32_System_Com",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }
# The COM plugin passkey manager (passkeys/windows.rs): `#[implement]` and `#[interface]` name
# windows_core directly. The version the windows crate above brings.
windows-core = "0.61"

# A package update is handed to the package manager from a private scratch folder.
[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"
# logind and the screen saver say when the screen locks or the system sleeps.
# The same zbus (and features) tauri-plugin-opener already brings.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
