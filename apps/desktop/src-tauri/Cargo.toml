[package]
name = "uwulock-desktop"
description = "UwULock app for desktop, Android and iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "uwulock_desktop_lib"
# Only the one main.rs links against — one library less to link for every desktop build
# and test. Android wants a cdylib and iOS a staticlib: scripts/mobile.mjs adds them in
# the mobile builds (CI and `pnpm mobile:prepare` before a local one).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
uwulock-bitwarden.workspace = true
uwulock-core.workspace = true
uwulock-authenticator.workspace = true

base64.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde.workspace = true
sha2.workspace = true
url = "2"
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { workspace = true }
tracing.workspace = true
uuid.workspace = true
zeroize.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# The desktop's clipboard and its own updater. Phones copy through the plugin below, and
# get new versions from the release page (docs/mobile.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
minisign-verify = "0.2"
semver = "1"
tauri-plugin-updater = "2"

# Unlocking with a fingerprint or face (Android Keystore, iOS Keychain), copying secrets.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-uwulock-mobile = { path = "../../../crates/tauri-plugin-uwulock-mobile" }

# Credential Manager's provider calls into the app over JNI (passkeys/android.rs), and a
# site's Digital Asset Links are fetched for an app that asks. Both crates (and their
# features) are already in the Android build through Tauri and uwulock-bitwarden.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_StationsAndDesktops",
  "Win32_System_Threading",
] }

# Windows Hello (KeyCredentialManager): the same windows crate Tauri brings.
windows = { version = "0.61", features = [
  "Foundation",
  "Win32_System_Com",
  "Security_Credentials",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# A package update is handed to the package manager from a private scratch folder.
[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "3"
# logind and the screen saver say when the screen locks or the system sleeps.
# The same zbus (and features) tauri-plugin-opener already brings.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Files saved from a file request get `com.apple.quarantine` (setxattr). The provider key
# for the AutoFill extension goes into the shared Keychain (passkeys/apple.rs); the same
# security-framework rustls already brings.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
security-framework = "3"
